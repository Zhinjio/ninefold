name: Release

# Runs only when a version tag (v1.2, v1.3, ...) is pushed. Ordinary pushes do nothing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the manifest version
        run: |
          v=$(python3 -c 'import json; print(json.load(open("items-manifest.json"))["version"])')
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $v"
            exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Build the zips
        run: python3 build_ninefold.py --zip

      - name: Take the release notes from Changelog.md
        run: |
          python3 - <<'PY'
          import os
          head = "## Ninefold %s " % os.environ["VERSION"]
          out, on = [], False
          for line in open("Changelog.md", encoding="utf-8"):
              if line.startswith("## "):
                  if on:
                      break
                  on = line.startswith(head)
                  continue
              if on:
                  out.append(line)
          notes = "".join(out).strip()
          if not notes:
              raise SystemExit("No changelog entry for " + head.strip())
          open("notes.md", "w", encoding="utf-8").write(notes + "\n")
          PY

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/*-"$VERSION".zip \
            --title "Ninefold $VERSION" --notes-file notes.md
